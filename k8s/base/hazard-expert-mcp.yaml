# 与 engineering-scene-mcp 相同：nanobot namespace、prod 节点、源码 PVC、NodePort。
# 前置资源由 base.yaml 提供。本服务的全部运行配置集中在下方 env 中。
apiVersion: v1
kind: Service
metadata:
  name: hazard-expert-mcp
  namespace: nanobot
spec:
  type: NodePort
  selector:
    app: hazard-expert-mcp
  ports:
    - name: http
      port: 8082
      targetPort: http
      nodePort: 30088
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hazard-expert-mcp
  namespace: nanobot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hazard-expert-mcp
  template:
    metadata:
      labels:
        app: hazard-expert-mcp
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 10001
      nodeSelector:
        nanobot_node: "prod"
      # 留出同步分析请求的完成时间。
      terminationGracePeriodSeconds: 750
      containers:
        - name: hazard-expert-mcp
          image: hazard-expert-mcp:1.0.0
          imagePullPolicy: IfNotPresent
          workingDir: /mnt/source/hazard_expert_mcp
          ports:
            - name: http
              containerPort: 8082
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: MCP_HOST
              value: "0.0.0.0"
            - name: MCP_PORT
              value: "8082"
            - name: LOG_LEVEL
              value: "info"
            - name: HISTORY_DB_PATH
              value: "/app/data/analysis-history.sqlite3"
            # 服务访问凭证；调用方携带 Authorization: Bearer <此值>。
            - name: MCP_API_KEY
              value: "replace-with-a-long-random-service-token"
            - name: CONTAINER_UP_BASE_URL
              value: "http://192.168.199.168:30081"
            # 必须对应 container-up frontends.json 中已有的 frontend。
            - name: CONTAINER_UP_FRONTEND_ID
              value: "web-test"
            - name: CONTAINER_UP_API_KEY
              value: ""
            - name: CONTAINER_UP_TIMEOUT_SECONDS
              value: "720"
            - name: CONTAINER_UP_CONNECT_TIMEOUT_SECONDS
              value: "10"
            # 已部署的 MinIO S3 API 地址。
            - name: MINIO_ENDPOINT
              value: "http://192.168.199.167:9000"
            # 外部调用时填写调用方和 nanobot 均可访问的 S3 地址，不带桶名。
            # 直接使用此地址签名，桶名由 MINIO_BUCKET 单独指定。
            - name: MINIO_DOWNLOAD_ENDPOINT
              value: "http://192.168.199.167:9000"
            - name: MINIO_ACCESS_KEY
              value: "minio_admin_jfhtkw8kds"
            - name: MINIO_SECRET_KEY
              value: "minio_password_asdfjhur8k2kd"
            - name: MINIO_BUCKET
              value: "attachments"
            - name: MINIO_REGION
              value: "us-east-1"
            - name: MINIO_KEY_PREFIX
              value: "hazard-expert"
            - name: MINIO_PRESIGN_EXPIRY_SECONDS
              value: "86400"
            - name: MINIO_CONNECT_TIMEOUT_SECONDS
              value: "10"
            - name: MINIO_READ_TIMEOUT_SECONDS
              value: "120"
            - name: MAX_UPLOAD_BYTES
              value: "26214400"
          volumeMounts:
            - name: hazard-history
              mountPath: /app/data
            - name: source-root
              mountPath: /mnt/source
              readOnly: true
            - name: host-localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: host-timezone
              mountPath: /etc/timezone
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: source-root
          persistentVolumeClaim:
            claimName: nanobot-source-pvc
        - name: hazard-history
          persistentVolumeClaim:
            claimName: hazard-expert-history-pvc
        - name: host-localtime
          hostPath:
            path: /etc/localtime
        - name: host-timezone
          hostPath:
            path: /etc/timezone
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hazard-expert-history-pvc
  namespace: nanobot
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
