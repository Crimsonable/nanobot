apiVersion: v1
kind: Namespace
metadata:
  name: webserver
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: webserver-source-pv
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: standard
  hostPath:
    path: /data/nanobot_backend_k8s/source
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: webserver-source-pvc
  namespace: webserver
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: standard
  resources:
    requests:
      storage: 20Gi
  volumeName: webserver-source-pv
---
apiVersion: v1
kind: Service
metadata:
  name: web-server
  namespace: webserver
spec:
  type: NodePort
  selector:
    app: web-server
  ports:
    - name: http
      port: 8090
      targetPort: 8090
      nodePort: 30090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-server
  namespace: webserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-server
  template:
    metadata:
      labels:
        app: web-server
    spec:
      containers:
        - name: web-server
          image: web_server:v1
          imagePullPolicy: IfNotPresent
          workingDir: /workspace/nanobot
          command: ["python", "-m", "web_server.app"]
          env:
            - name: WEB_SERVER_HOST
              value: 0.0.0.0
            - name: WEB_SERVER_PORT
              value: "8090"
            - name: CONTAINER_UP_BASE_URL
              value: http://127.0.0.1:30080
            - name: WEB_SERVER_DEFAULT_FRONTEND_ID
              value: web-main
            - name: WEB_SERVER_OUTBOUND_ECHO
              value: "1"
          ports:
            - containerPort: 8090
          volumeMounts:
            - name: source-root
              mountPath: /workspace/nanobot
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8090
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: source-root
          persistentVolumeClaim:
            claimName: webserver-source-pvc
