# 与 engineering-scene-mcp 相同：opencode-sv namespace、存储节点、源码 PVC、NodePort。
# 前置资源由 k8s/opencode/storage.yaml 提供。本服务的全部运行配置集中在下方 env 中。
apiVersion: v1
kind: Service
metadata:
  name: hazard-expert-mcp
  namespace: opencode-sv
spec:
  type: NodePort
  selector:
    app: hazard-expert-mcp
  ports:
    - name: http
      port: 8082
      targetPort: http
      nodePort: 30088
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hazard-expert-mcp
  namespace: opencode-sv
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hazard-expert-mcp
  template:
    metadata:
      labels:
        app: hazard-expert-mcp
    spec:
      enableServiceLinks: false
      nodeSelector:
        opencode-runtime: "true"
      # 留出同步分析请求的完成时间。
      terminationGracePeriodSeconds: 750
      containers:
        - name: hazard-expert-mcp
          image: hazard-expert-mcp:1.0.0
          imagePullPolicy: IfNotPresent
          workingDir: /mnt/source/hazard_expert_mcp
          ports:
            - name: http
              containerPort: 8082
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: MCP_HOST
              value: "0.0.0.0"
            - name: MCP_PORT
              value: "8082"
            - name: LOG_LEVEL
              value: "info"
            # 服务访问凭证；调用方携带 Authorization: Bearer <此值>。
            - name: MCP_API_KEY
              value: "replace-with-a-long-random-service-token"
            - name: CONTAINER_UP_BASE_URL
              value: "http://channel-gateway.opencode-sv.svc.cluster.local:8000"
            # 必须对应 common/frontends.json 中已有的 frontend。
            - name: CONTAINER_UP_FRONTEND_ID
              value: "web-test"
            - name: CONTAINER_UP_TIMEOUT_SECONDS
              value: "720"
            - name: CONTAINER_UP_CONNECT_TIMEOUT_SECONDS
              value: "10"
            # 对接仓库 k8s/minio/minio.yaml 中的 S3 Service。
            - name: MINIO_ENDPOINT
              value: "http://minio.minio.svc.cluster.local:9000"
            # 外部调用时填写调用方和 OpenCode 工具均可访问的 S3 地址，不带桶名。
            # 留空使用上面的集群地址，下载链接此时仅适用于能解析集群 DNS 的客户端。
            - name: MINIO_DOWNLOAD_ENDPOINT
              value: ""
            - name: MINIO_ACCESS_KEY
              value: "replace-with-minio-access-key"
            - name: MINIO_SECRET_KEY
              value: "replace-with-minio-secret-key"
            - name: MINIO_BUCKET
              value: "attachments"
            - name: MINIO_REGION
              value: "us-east-1"
            - name: MINIO_KEY_PREFIX
              value: "hazard-expert"
            - name: MINIO_PRESIGN_EXPIRY_SECONDS
              value: "86400"
            - name: MINIO_CONNECT_TIMEOUT_SECONDS
              value: "10"
            - name: MINIO_READ_TIMEOUT_SECONDS
              value: "120"
            - name: MAX_UPLOAD_BYTES
              value: "26214400"
          volumeMounts:
            - name: source-root
              mountPath: /mnt/source
              readOnly: true
            - name: host-localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: host-timezone
              mountPath: /etc/timezone
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: source-root
          persistentVolumeClaim:
            claimName: opencode-source-pvc
        - name: host-localtime
          hostPath:
            path: /etc/localtime
        - name: host-timezone
          hostPath:
            path: /etc/timezone
