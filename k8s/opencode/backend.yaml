apiVersion: v1
kind: ServiceAccount
metadata:
  name: container-up
  namespace: opencode-sv
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: container-up-buckets
  namespace: opencode-sv
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - create
  - update
- apiGroups:
  - apps
  resources:
  - deployments/scale
  verbs:
  - get
  - update
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: container-up-buckets
  namespace: opencode-sv
subjects:
- kind: ServiceAccount
  name: container-up
  namespace: opencode-sv
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: container-up-buckets
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: container-up
  namespace: opencode-sv
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: container-up
  template:
    metadata:
      labels:
        app: container-up
    spec:
      automountServiceAccountToken: true
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: control
        args:
        - python
        - -m
        - container_up
        - --config
        - /mnt/common/frontends.json
        image: agent-container-up:opencode-1.18.31
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8000
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8000
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
        - name: workspace
          mountPath: /mnt/env
          readOnly: false
        - name: source
          mountPath: /mnt/source
          readOnly: true
        - name: common
          mountPath: /mnt/common
          readOnly: true
        workingDir: /mnt/source
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: opencode-state-pvc
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi
      - name: workspace
        persistentVolumeClaim:
          claimName: opencode-data-pvc
          readOnly: false
      - name: source
        persistentVolumeClaim:
          claimName: opencode-source-pvc
          readOnly: true
      - name: common
        persistentVolumeClaim:
          claimName: opencode-common-pvc
          readOnly: true
      serviceAccountName: container-up
      nodeSelector:
        opencode-runtime: 'true'
---
apiVersion: v1
kind: Service
metadata:
  name: container-up
  namespace: opencode-sv
spec:
  selector:
    app: container-up
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30080
  type: NodePort
