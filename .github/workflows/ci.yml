name: OpenCode backend tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: python -m pip install -e '.[test]'
      - run: ruff check agent_backend bucket_runtime channel_gateway container_up --select F
      - run: npm ci --prefix opencode_plugin
      - run: npm run build --prefix opencode_plugin
      - run: python -m pytest tests -q
      - run: npm test --prefix opencode_plugin
