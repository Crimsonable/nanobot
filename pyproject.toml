[project]
name = "opencode-sv"
version = "0.1.0"
description = "OpenCode server with channel routing and per-bucket runtime adapters"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "PyYAML==6.0.3",
    "websockets==16.1.1",
    "aiohttp==3.14.3",
    "loguru==0.7.3",
    "boto3==1.43.97",
    "pycryptodome==3.23.0",
    "lark-oapi==1.5.5",
    "python-multipart==0.0.32"
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9", "Pillow>=11", "Jinja2>=3.1", "python-docx>=1.1"]

[project.scripts]
channel-gateway = "channel_gateway.__main__:main"
container-up = "container_up.__main__:main"
bucket-runtime = "bucket_runtime.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["channel_gateway*", "agent_backend*", "container_up*", "bucket_runtime*", "web_server*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["agent_backend", "channel_gateway", "container_up", "bucket_runtime"]
omit = ["tests/*"]
