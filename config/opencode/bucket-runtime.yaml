bucket_id: bucket-0
control_url: ws://container-up:8000/internal/buckets/ws
credential_file: /run/secrets/bucket-0
state_root: /data/runtime
workspace_root: /data/workspaces
rpc_port: 4097
health_port: 8090
opencode:
  binary: /opt/opencode/opencode
  version: 1.18.31
  sha256: f9dab32248695e9ebd56b16a1921798fd85112cf5a69c7dfd0cabc1e17be4a11
  port: 4096
  context_root: /opt/runtime-context
  config_file: /run/secrets/opencode-models.json
  plugin_file: /opt/opencode-plugin/dist/index.mjs
  dependency_dir: /opt/opencode-plugin
sandbox:
  binary: /usr/bin/bwrap
  readonly_roots: [/usr, /bin, /lib, /lib64, /etc/ld.so.cache, /etc/fonts, /opt/toolchain]
  shell: /bin/sh
profiles:
  reports:
    model: intranet/your-model
    instructions: >-
      Read the relevant SKILL.md in the public directories before generating reports.
      Save generated files in output and publish them with publish_attachment.
    public_roots: [/opt/public]
limits:
  active: 4
  queued: 64
  request_seconds: 600
  file_bytes: 52428800
