# Defaults apply only to users of this frontend. Matching users override selected fields.
defaults:
  sandbox:
    enabled: true              # must remain true for frontend directory isolation
    network: false             # network namespace access when bwrap is enabled
  session:
    enabled: true              # must remain true: session rules + native file-tool path checks
    default_tools: true        # tools enabled by default; directory scope still applies
    tools: {}                  # e.g. {webfetch: false, task: false, bash: true}
  filesystem:
    workspace: read_write      # read_write | read_only | none; always this user's directory
    public_roots: null         # null inherits profile roots; common paths must stay under /mnt/common/{frontend_id}/app; [] grants none
users: []
# Example: alice may only read her workspace and /mnt/source/public/manuals.
# users:
#   - user_id: alice
#     filesystem:
#       workspace: read_only
#       public_roots: [/mnt/source/public/manuals]
