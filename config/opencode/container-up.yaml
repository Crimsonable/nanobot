host: 0.0.0.0
port: 8000
state_root: /data/control
bucket_credentials:
  bucket-0: /run/secrets/bucket-0
frontends:
  web:
    provider: web
    profile_id: reports
    credential_file: /run/secrets/web-channel.json
    api_key_file: /run/secrets/web-api-key
storage:
  endpoint: http://minio:9000
  bucket: attachments
  access_key_file: /run/secrets/minio-access-key
  secret_key_file: /run/secrets/minio-secret-key
  public_base_url: ""
download_hosts: [minio]
# Configure only the exact storage/service networks used by this installation.
download_private_cidrs: []
limits:
  request_seconds: 600
  file_bytes: 52428800
  spool_bytes: 1073741824
