<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成都院智成安监检查反馈意见</title>
<style>
:root{
  --bg:#f5f7fa;
  --card:#ffffff;
  --border:#e2e8f0;
  --text:#1a202c;
  --text2:#64748b;
  --red:#dc2626;
  --orange:#ea580c;
  --blue:#2563eb;
  --green:#16a34a;
  --red-bg:#fef2f2;
  --red-bd:#fecaca;
  --orange-bg:#fff7ed;
  --orange-bd:#fed7aa;
  --blue-bg:#eff6ff;
  --blue-bd:#bfdbfe;
  --green-bg:#f0fdf4;
  --green-bd:#bbf7d0;
}
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}
html,body{
  background:var(--bg);
  font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  color:var(--text);
  line-height:1.7;
  font-size:14px;
  -webkit-font-smoothing:antialiased;
}
.container{
  max-width:900px;
  margin:0 auto;
  padding:24px 16px;
}
/* 标题 */
.report-title{
  text-align:center;
  font-size:1.5rem;
  font-weight:700;
  color:var(--text);
  margin-bottom:24px;
  letter-spacing:1px;
}
/* 卡片 */
.card{
  background:var(--card);
  border-radius:12px;
  padding:20px 24px;
  margin-bottom:16px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
  border:1px solid var(--border);
}
.section-header{
  font-size:1rem;
  font-weight:700;
  color:var(--text);
  margin-bottom:16px;
  padding-bottom:10px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:8px;
}
.section-header .num{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:24px;
  height:24px;
  border-radius:50%;
  font-size:0.75rem;
  font-weight:700;
  color:#fff;
  flex-shrink:0;
}
/* 信息网格 */
.info-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px 32px;
}
.info-item{
  display:flex;
  font-size:0.9rem;
}
.info-label{
  color:var(--text2);
  min-width:100px;
  flex-shrink:0;
  font-weight:500;
}
.info-value{
  color:var(--text);
}
/* 场景关键词 */
.scene-keywords{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.keyword-tag{
  padding:4px 12px;
  background:var(--blue-bg);
  border:1px solid var(--blue-bd);
  border-radius:6px;
  font-size:0.8rem;
  color:var(--blue);
  font-weight:500;
}
/* 表格 */
.table-wrapper{
  overflow-x:auto;
}
table{
  width:100%;
  border-collapse:collapse;
  font-size:0.85rem;
}
th{
  background:#f8fafc;
  padding:10px 12px;
  text-align:left;
  font-weight:600;
  color:var(--text);
  border:1px solid var(--border);
  white-space:nowrap;
}
td{
  padding:10px 12px;
  border:1px solid var(--border);
  color:var(--text);
  vertical-align:top;
}
.tr-highlight td{
  background:#fff5f5;
}
.tr-warning td{
  background:#fff7ed;
}
.tr-suggest td{
  background:#eff6ff;
}
.hazard-desc{
  font-weight:500;
  color:var(--text);
}
.level-tag{
  display:inline-block;
  padding:3px 10px;
  border-radius:6px;
  font-size:0.7rem;
  font-weight:700;
}
.level-severe{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bd)}
.level-general{background:var(--orange-bg);color:var(--orange);border:1px solid var(--orange-bd)}
.level-suggest{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-bd)}
.clause-list{
  margin-top:6px;
}
.clause-item{
  margin-bottom:4px;
  font-size:0.8rem;
  line-height:1.5;
}
.clause-item strong{
  color:var(--blue);
  font-weight:600;
}
.clause-text{
  color:var(--text);
}
.photo-cell{
  width:120px;
}
.photo-cell img{
  max-width:100px;
  max-height:80px;
  border-radius:6px;
  border:1px solid var(--border);
}
.remark-cell{
  color:var(--text2);
  font-size:0.8rem;
}
.fix-suggest{
  margin-top:6px;
  padding:6px 10px;
  background:#f8fafc;
  border-radius:6px;
  border-left:3px solid var(--blue);
  font-size:0.8rem;
  color:var(--text);
}
/* 统计摘要 */
.summary-row{
  display:flex;
  gap:16px;
  margin-bottom:16px;
  flex-wrap:wrap;
}
.summary-box{
  flex:1;
  min-width:120px;
  padding:14px 20px;
  border-radius:10px;
  text-align:center;
}
.summary-box.red{background:var(--red-bg);border:1px solid var(--red-bd)}
.summary-box.orange{background:var(--orange-bg);border:1px solid var(--orange-bd)}
.summary-box.blue{background:var(--blue-bg);border:1px solid var(--blue-bd)}
.summary-box.green{background:var(--green-bg);border:1px solid var(--green-bd)}
.summary-box .num{font-size:1.8rem;font-weight:800;line-height:1}
.summary-box .label{margin-top:4px;color:var(--text2);font-size:0.8rem}
/* 改进事项 */
.improvement-item{
  padding:12px 0;
  border-bottom:1px solid var(--border);
}
.improvement-item:last-child{border-bottom:none}
/* 工作提醒 */
.reminder-content{
  padding:12px 16px;
  background:#f8fafc;
  border-radius:8px;
  border-left:4px solid var(--orange);
  font-size:0.9rem;
  color:var(--text);
  line-height:1.8;
}
/* 页脚 */
.footer{
  text-align:center;
  padding:20px;
  color:var(--text2);
  font-size:0.8rem;
  border-top:1px solid var(--border);
  margin-top:16px;
}
.footer .company{
  font-weight:600;
  color:var(--blue);
  margin-bottom:4px;
}
@media(max-width:640px){
  .info-grid{grid-template-columns:1fr}
  .summary-row{flex-direction:column}
  .report-title{font-size:1.2rem}
  table{font-size:0.8rem}
  th,td{padding:8px 6px}
  .photo-cell img{max-width:70px;max-height:60px}
}
</style>
</head>
<body>
<div class="container">

<!-- 标题 -->
<div class="report-title">成都院智成安监检查反馈意见</div>

<!-- 基本信息 -->
<div class="card">
  <div class="section-header">
    <span class="num" style="background:var(--blue)">1</span>
    基本信息（含提交人姓名，检查时间等）
  </div>
  <div class="info-grid" id="basicInfo"></div>
</div>

<!-- 场景认定 -->
<div class="card">
  <div class="section-header">
    <span class="num" style="background:var(--green)">2</span>
    场景认定（含关键字）
  </div>
  <div class="scene-keywords" id="sceneKeywords"></div>
</div>

<!-- 现场事故隐患总体评价 -->
<div class="card">
  <div class="section-header">
    <span class="num" style="background:var(--orange)">3</span>
    现场事故隐患总体评价
  </div>
  <div class="summary-row" id="summaryRow"></div>
</div>

<!-- 现场事故隐患清单 -->
<div class="card">
  <div class="section-header">
    <span class="num" style="background:var(--red)">4</span>
    现场事故隐患清单
  </div>

  <!-- 重大事故隐患 -->
  <div style="margin-bottom:24px">
    <div class="section-header" style="font-size:0.95rem;margin-bottom:12px;padding-bottom:8px">
      （一）重大事故隐患
    </div>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th style="width:50px">序号</th>
            <th style="width:120px">现场照片</th>
            <th>存在的重大事故隐患</th>
            <th>判定依据</th>
            <th style="width:120px">备注</th>
          </tr>
        </thead>
        <tbody id="severeHazards"></tbody>
      </table>
    </div>
  </div>

  <!-- 一般事故隐患 -->
  <div>
    <div class="section-header" style="font-size:0.95rem;margin-bottom:12px;padding-bottom:8px">
      （二）一般事故隐患
    </div>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th style="width:50px">序号</th>
            <th style="width:120px">现场照片</th>
            <th>存在的一般事故隐患</th>
            <th>判定依据</th>
            <th style="width:120px">备注</th>
          </tr>
        </thead>
        <tbody id="generalHazards"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- 现场改进提升事项清单 -->
<div class="card">
  <div class="section-header">
    <span class="num" style="background:var(--green)">5</span>
    现场改进提升事项清单
  </div>
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th style="width:50px">序号</th>
          <th style="width:120px">现场照片</th>
          <th>存在的改进提升事项</th>
          <th>判定依据</th>
          <th style="width:120px">备注</th>
        </tr>
      </thead>
      <tbody id="improvementList"></tbody>
    </table>
  </div>
</div>

<!-- 下一步安全生产工作提醒 -->
<div class="card">
  <div class="section-header">
    <span class="num" style="background:var(--orange)">6</span>
    下一步安全生产工作提醒
  </div>
  <div class="reminder-content" id="reminderContent"></div>
</div>

<!-- 页脚 -->
<div class="footer">
  <div class="company">中国电建成都院智成安监系统</div>
</div>

</div>
</body>
</html>
